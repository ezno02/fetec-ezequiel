<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="menu-hamburguer">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg>
            <!-- modal apenas para exemplo, mas sera feito no js -->
            <div class="menu hidden">
                <ul class="links">
                    <li><a href="#">Turmas</a></li>
                    <li><a href="#">Alunos</a></li>
                    <li><a href="#">Sair</a></li>
                </ul>
            </div>
        </div>
        <div class="title-div">
            <h1>Fetec</h1>
        </div>
        <div class="user-avatar">
            <!-- parte de avatar do usuario(ser feito com js) -->
            User
        </div>
    </header>
    <main>
        <section class="turmas" id="turmas">
            <div class="turmas-header">
                <h2>Turmas</h2>
                <div class="add-turma">
                    <svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px" fill="#1f1f1f"><path d="M446.67-446.67H200v-66.66h246.67V-760h66.66v246.67H760v66.66H513.33V-200h-66.66v-246.67Z"/></svg>
                </div>
            </div>
            <div class="turmas-map" id="turmas-map"></div>
        </section>
    </main>
    <div class="overlay-create-turma hidden">
        <div class="container">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
            <h2>Turma Nova</h2>
            <form action="">
                <div class="label">
                    <label for="nome-turma">Nome da Turma</label>
                    <input type="text" name="nome-turma" id="nomeTurma">
                </div>
                <div class="label">
                    <label for="serie-turma">Serie da Turma</label>
                    <input type="number" min="1" max="3" name="serie-turma" id="serieTurma">
                </div>
                <div class="label">
                    <label for="divisao-turma">Divisao entre turma A e B</label>
                    <input type="checkbox" name="divisao-turma" id="divisaoTurma">
                </div>
                <button type="submit">Enviar</button>
            </form>
        </div>
    </div>
</body>

</html>
