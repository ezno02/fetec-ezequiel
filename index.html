<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=close" />
</head>

<body>

    <header>
        <div class="menu-hamburguer">
            <span class="material-symbols-outlined">menu</span>
            <!-- modal apenas para exemplo, mas sera feito no js -->
            <div class="menu hidden">
                <li class="links">
                    <ul><a href="#">Turmas</a></ul>
                    <ul><a href="#">Alunos</a></ul>
                    <ul><a href="#">Sair</a></ul>
                </li>
            </div>
        </div>
        <div class="title-div">
            <h1>Fetec</h1>
        </div>
        <div class="user-avatar">
            <!-- parte de avatar do usuario(ser feito com js) -->
            User
        </div>
    </header>
    <div class="menu-hamburguer hamburguer">
        <span class="material-symbols-outlined">menu</span>
    </div>
    <main>
        <section class="turmas" id="turmas">
            <div class="turmas-header">
                <h2>Turmas</h2>
                <div class="add-turma">
                    <span class="material-symbols-outlined">add</span>
                </div>
            </div>
            <div class="turmas-map" id="turmas-map"></div>
        </section>
    </main>
    <div class="overlay-create-turma ">
        <div class="container">
            <span class="material-symbols-outlined close">close</span>
            <h2>Turma Nova</h2>
            <form action="">
                <div class="label">
                    <label for="nome-turma">Nome da Turma</label>
                    <input type="text" name="nome-turma" id="nomeTurma">
                </div>
                <div class="label">
                    <label for="serie-turma">Serie da Turma</label>
                    <input type="number" min="1" max="3" name="serie-turma" id="serieTurma">
                </div>
                <div class="label">
                    <label for="divisao-turma">Divisao entre turma A e B</label>
                    <input type="checkbox" name="divisao-turma" id="divisaoTurma">
                </div>
                <button type="submit">Enviar</button>
            </form>
        </div>
    </div>
</body>

</html>
